<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lenissa Boubou | Interaction Designer</title>

    <!-- JavaScript -->
    <script src="script.js" type="module"></script>

    <!-- General styling -->
    <link rel="stylesheet" href="style.css" />

    <!-- Colour theme -->
    <link id="themeStylesheet" rel="stylesheet" href="blue.css" />

    <!-- Reading mode, initially disabled -->
    <link
      id="readingStylesheet"
      rel="stylesheet"
      href="reading-mode.css"
      disabled
    />
  </head>

  <body>
    <!-- THEME CONTROLS -->
    <div class="controls">
      <button id="readingToggle">Reading mode</button>

      <div class="palette-buttons">
        <button
          class="colour-button blue"
          data-theme="blue.css"
          aria-pressed="true"
          aria-label="Blue theme"
        ></button>

        <button
          class="colour-button brown"
          data-theme="brown.css"
          aria-pressed="false"
          aria-label="Brown theme"
        ></button>

        <button
          class="colour-button green"
          data-theme="green.css"
          aria-pressed="false"
          aria-label="Green theme"
        ></button>

        <button
          class="colour-button purple"
          data-theme="purple.css"
          aria-pressed="false"
          aria-label="Purple theme"
        ></button>

        <button
          class="colour-button white"
          data-theme="white.css"
          aria-pressed="false"
          aria-label="White theme"
        ></button>
      </div>
    </div>

    <!-- PORTFOLIO -->
    <main class="portfolio">
      <header class="portfolio-header">
        <p class="location">MALMÖ, SWEDEN</p>

        <p class="email">
          <a href="mailto:BOUBOULENISSA@ICLOUD.COM">
            BOUBOULENISSA@ICLOUD.COM
          </a>
        </p>
      </header>

      <section class="intro">
        <h1>LENISSA BOUBOU</h1>

        <figure class="portfolio-image">
          <img
            src="https://picsum.photos/seed/portfolio/600/400"
            alt="Portfolio project preview"
          />
        </figure>

        <h2>INTERACTION DESIGNER</h2>
      </section>
    </main>
  </body>
</html>
